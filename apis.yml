name: UpsideHoM
description: Upside (joinupside.com, originally UpsideHoM) is a housing-stability
  company for health plans and employers. It finds, houses, and stabilizes members
  whose housing instability disrupts health, care, and outcomes at scale - accepting
  referrals, assessing housing needs, executing stabilization or transitions,
  coordinating with community partners, and documenting outcomes for Medicaid and
  Medicare plans, health systems, and employer programs. A Techstars portfolio
  company, Upside publishes no public developer program or API surface as of
  2026-07-21.
